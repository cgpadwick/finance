[project]
name = "finance-momentum"
version = "0.1.0"
description = "Momentum-investing stock screener (data ingest + momentum engine + API)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.1",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "alpaca-py>=0.30",
    "requests>=2.32",
    "tqdm>=4.66",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "scikit-learn>=1.4",
    "umap-learn>=0.5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
